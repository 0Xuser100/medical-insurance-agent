x-uv-image: &uv-image ghcr.io/astral-sh/uv:python3.12-bookworm-slim

services:
  api:
    image: *uv-image

    container_name: medical-insurance-api

    working_dir: /app

    ports:
      - "8000:8000"

    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME}
      - API_HOST=${API_HOST}
      - API_PORT=${API_PORT}
      - CREWAI_TRACING_ENABLED=${CREWAI_TRACING_ENABLED}

    volumes:
      - .:/app
      - ./uploads:/app/uploads

    networks:
      - backend

    command: sh -c "uv sync --frozen --no-dev && uv run uvicorn src.api.main:app --host 0.0.0.0 --port 8000"

    restart: always

networks:
  backend:
